
name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.0

      - name: Scan Docker image
        run: |
          VERSION=${GITHUB_REF##*/}
          make scan-image VERSION=$VERSION SCAN_PLATFORM=linux/amd64
          make scan-image VERSION=$VERSION SCAN_PLATFORM=linux/arm64

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Make release binaries
        run: |
          VERSION=${GITHUB_REF##*/}
          echo "Using version: $VERSION"
          make release VERSION=$VERSION

      - name: Verify release checksums
        working-directory: releases
        run: sha256sum -c *.sha256

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'releases/leafwiki-${{ github.ref_name }}-*'

      - name: Get latest tag before current one
        id: latest
        run: |
          TAGS=$(git tag --sort=-v:refname)
          echo "Available tags: $TAGS"
          CURRENT="$GITHUB_REF_NAME"
          PREVIOUS=""
          for tag in $TAGS; do
            if [ "$tag" = "$CURRENT" ]; then continue; fi
            PREVIOUS=$tag
            break
          done
          echo "Found previous tag: $PREVIOUS"
          echo "tag=$PREVIOUS" >> $GITHUB_OUTPUT

      - name: Generate categorized changelog
        id: changelog
        env:
          PREVIOUS: ${{ steps.latest.outputs.tag }}
        run: |
          make changelog PREVIOUS="$PREVIOUS" CURRENT="$GITHUB_REF_NAME"
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat current_release_changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: LeafWiki ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            releases/leafwiki-${{ github.ref_name }}-linux-amd64
            releases/leafwiki-${{ github.ref_name }}-linux-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-linux-386
            releases/leafwiki-${{ github.ref_name }}-linux-386.sha256
            releases/leafwiki-${{ github.ref_name }}-linux-arm64
            releases/leafwiki-${{ github.ref_name }}-linux-arm64.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64
            releases/leafwiki-${{ github.ref_name }}-darwin-amd64.sha256
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64
            releases/leafwiki-${{ github.ref_name }}-darwin-arm64.sha256
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe
            releases/leafwiki-${{ github.ref_name }}-windows-amd64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
